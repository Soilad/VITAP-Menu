<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<!-- evil web previews -->
		<link rel="icon" type="image/x-icon" href="/assets/Yuchiru.png">
		<!-- Standard Open Graph (Facebook, LinkedIn, Slack) -->
		<meta property="og:title" content="VITAP-Menu" />
		<meta property="og:description" content="Shitty website that shows you the VITAP Mess Menu bcuz imagine having ads on your app lmao" />
		<meta property="og:image" content="https://github.com/Soilad/VITAP-Menu/blob/main/assets/Good.jpg?raw=true" />
		<meta property="og:url" content="https://soilad.github.io/VITAP-Menu/" />
		<meta property="og:type" content="website" />

		<!-- Twitter/X Card (uses same image but requires this tag) -->
		<meta name="twitter:card" content="https://github.com/Soilad/VITAP-Menu/blob/main/assets/Good.jpg?raw=true" />
		<meta name="twitter:title" content="VITAP-Menu" />
		<meta name="twitter:description" content="Shitty website that shows you the VITAP Mess Menu bcuz imagine having ads on your app lmao" />
		<meta name="twitter:image" content="https://soilad.github.io/VITAP-Menu/" />
		<title>VIT-AP Mess Menu</title>
		<link href="css/style.css" rel="stylesheet">
		<script src="js/main.js"></script>
		<script>
			currentDate = new Date();
			var menuJSON = loadJSON("./menu.json");
			var timeEntries = [
				{
					name: "Breakfast",
					start: new Date(new Date(currentDate).setHours(7, 15, 0, 0)),
					end: new Date(new Date(currentDate).setHours(9, 0, 0, 0)),
				}, {
					name: "Lunch",
					start: new Date(new Date(currentDate).setHours(12, 15, 0, 0)),
					end: new Date(new Date(currentDate).setHours(14, 0, 0, 0)),
				}, {
					name: "Snacks",
					start: new Date(new Date(currentDate).setHours(16, 15, 0, 0)),
					end: new Date(new Date(currentDate).setHours(18, 15, 0, 0)),
				}, {
					name: "Dinner",
					start: new Date(new Date(currentDate).setHours(19, 15, 0, 0)),
					end: new Date(new Date(currentDate).setHours(21, 0, 0, 0)),
				}
			];
			timeEntries.sort(
				(entry1, entry2) => {
					return (
						Math.abs(
							entry1.start.getTime() 
							- currentDate.getTime()
						) - Math.abs(
							entry2.start.getTime() 
							- currentDate.getTime()
						)
					);
				}
			)
		</script>
	</head>
	<body onload="init(currentDate, timeEntries, menuJSON);update(currentDate, timeEntries, menuJSON);">
		<div class="Header">
			<img src="./assets/Yuchiru.png" alt="" width="100">
			<h1>VIT-AP Mess Menu</h1>
		</div>
		<div class="Header">
			<a href="https://www.instagram.com/_soilad_/">Instagram</a>
			<a href="https://soilad.github.io/VITAP-Menu/">Github</a>
			<a href="https://raw.githubusercontent.com/Soilad/VITAP-Menu/refs/heads/main/assets/gpay.png">Support Me!</a>
			<a href="https://youtu.be/2p07dBnwzck?si=N4qlJoKK4n_H653A">Report To VIT-AP Staff</a>
		</div>
		<div class="Header">
			<button class="ChangeDate" type="" onclick="lockByMonth(currentDate, -1); update(currentDate, timeEntries, menuJSON, true);">&lt;</button>
			<input type="number" id="monthDay">
			<button class="ChangeDate" type="" onclick="lockByMonth(currentDate, 1); update(currentDate, timeEntries, menuJSON, true);">&gt;</button>
		</div>
		<div id="timeEntries">
		</div>
	</body>
</html>
